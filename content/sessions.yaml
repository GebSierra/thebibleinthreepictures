      question: What did the LORD do for Israel that day?
      answer: He saved Israel from the Egyptians.
      kind: observe
    - ref: Exodus 20:2
      question: Before he gives the commands, what does God remind Israel he has done?
      answer: Brought them out of Egypt, out of slavery.
      kind: observe
