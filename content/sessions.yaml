    - ref: 1 Timothy 1:15
      question: Why did Christ Jesus come into the world?
      answer: To save sinners.
      kind: observe
    - ref: 1 Corinthians 15:3-4
      question: What three things happened to Christ, in order?
      answer: He died for our sins, was buried, and was raised on the third day.
      kind: observe
