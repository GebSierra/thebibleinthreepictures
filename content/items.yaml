# Level 1 check items for the app. Home: this repo (app only for now).
# Every item prepares for one test-out item (test_out) in content/test-outs.md.
# use: where the item may appear. "choice" items are for lessons only.
# A slot with "from" takes its value from content/sessions.yaml.
# Status: AI DRAFT unless marked otherwise. Geb approves each item.
items:

